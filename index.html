<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GPL Manager</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f1e8;--sf:#fff;--tx:#14201a;--mu:#68716b;--ac:#0b6b3a;--go:#e8b923;--rd:#c8102e;--bd:#dcd8c8;--on:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1511;--sf:#18201a;--tx:#ecf0e8;--mu:#93a096;--ac:#3fcf82;--bd:#2a342c;--on:#08120c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1511;--sf:#18201a;--tx:#ecf0e8;--mu:#93a096;--ac:#3fcf82;--bd:#2a342c;--on:#08120c;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:400 15px/1.45 "Bricolage Grotesque",system-ui,sans-serif;max-width:560px;margin-inline:auto;padding:12px 14px 40px}
h1{font-size:26px;font-weight:800;margin:6px 0 2px;letter-spacing:-.02em}h2{font-size:17px;margin:18px 0 8px}
.mu{color:var(--mu)}.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
.bar{height:6px;background:linear-gradient(90deg,var(--rd) 33%,var(--go) 33% 66%,var(--ac) 66%);border-radius:3px;margin-bottom:10px}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--sf);color:var(--tx);padding:9px 12px;border-radius:8px}
button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.go{background:var(--ac);color:var(--on);border-color:var(--ac);font-weight:600;width:100%;padding:13px;font-size:16px}
.tabs{display:flex;gap:6px;margin:12px 0;overflow-x:auto}.tabs button{flex:1;white-space:nowrap}.tabs .on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:10px;padding:12px;margin:8px 0}
.sc{font-size:30px;font-weight:800;text-align:center}
.wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
td,th{padding:6px 4px;text-align:right;border-bottom:1px solid var(--bd);font-size:14px}td:nth-child(2),th:nth-child(2){text-align:left}th{color:var(--mu);font-weight:400}
tr.me td{background:color-mix(in srgb,var(--go) 28%,transparent);font-weight:600}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:8px}.pick button{text-align:left}
.ch{display:flex;gap:6px;flex-wrap:wrap}.ch button.on{background:var(--ac);color:var(--on);border-color:var(--ac)}
.w{color:var(--ac);font-weight:600}.l{color:var(--rd);font-weight:600}.sm{padding:5px 9px;font-size:13px}.news{border-left:4px solid var(--go);padding-left:10px;margin:8px 0}
</style></head><body>
<div class="bar"></div><div id="app"></div>
<script>
const T=[["Accra Hearts of Oak",74],["Asante Kotoko",74],["Medeama SC",72],["Aduana Stars",68],["Bechem United",66],["Berekum Chelsea",65],["Dreams FC",66],["Samartex",67],["Nations FC",64],["Karela United",62],["Heart of Lions",63],["Basake Holy Stars",58],["Vision FC",60],["Bibiani Gold Stars",64],["Racing Club",58],["Legon Cities",62],["Great Olympics",61],["Real Tamale United",60]];
const FM={"4-4-2":[4,4,2],"4-3-3":[4,3,3],"5-3-2":[5,3,2],"3-5-2":[3,5,2]};
const FN=["Kwame","Kofi","Yaw","Kwesi","Nana","Abdul","Samuel","Emmanuel","Isaac","Prince","Eric","Joseph","Razak","Ibrahim","Daniel","Richard","Seidu","Mohammed"];
const SN=["Mensah","Boateng","Owusu","Appiah","Asare","Adjei","Tetteh","Quaye","Amoah","Darko","Frimpong","Sarpong","Yeboah","Nortey","Ansah","Acquah","Issah","Lamptey"];
const R=s=>()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const FL=["🇳🇬","🇨🇮","🇹🇬","🇧🇫","🇱🇷","🇧🇯","🇲🇱","🇸🇳"];const POS=["GK","GK","DF","DF","DF","DF","DF","DF","MF","MF","MF","MF","MF","MF","FW","FW","FW","FW"];
const mkSQ=()=>T.map((t,i)=>{const r=R(i*977+13);return POS.map(p=>({n:FN[r()*FN.length|0]+" "+SN[r()*SN.length|0],p,r:Math.round(t[1]+(r()-.5)*14),a:18+(r()*16|0),f:r()<.12?FL[r()*8|0]:"🇬🇭",inj:0}))});let SQ=mkSQ();
function fixtures(){const n=18,a=[...Array(n).keys()],rs=[];for(let r=0;r<n-1;r++){const m=[];for(let i=0;i<n/2;i++){const h=a[i],b=a[n-1-i];m.push(r%2?[b,h]:[h,b])}rs.push(m);a.splice(1,0,a.pop())}return rs.concat(rs.map(m=>m.map(([h,b])=>[b,h])))}
const FX=fixtures();
function xi(i,f){const s=SQ[i],[d,m,w]=FM[f],g=p=>s.filter(x=>x.p==p&&!x.inj).sort((a,b)=>b.r-a.r);return{GK:g("GK").slice(0,1),DF:g("DF").slice(0,d),MF:g("MF").slice(0,m),FW:g("FW").slice(0,w)}}
const av=a=>a.length?a.reduce((s,x)=>s+x.r,0)/a.length:40;
function str(i,f,st){const x=xi(i,f);let at=av(x.FW)*.55+av(x.MF)*.35+av(x.DF)*.1,df=av(x.DF)*.5+(x.GK[0]?x.GK[0].r:40)*.3+av(x.MF)*.2;if(st=="Attack"){at+=3;df-=3}if(st=="Defend"){at-=3;df+=3}if(i==S.club){const b=(S.mor-50)/20;at+=b;df+=b}return[at,df]}
const poi=l=>{const L=Math.exp(-l);let k=0,p=1;do{k++;p*=Math.random()}while(p>L);return k-1};
let S=null;try{S=JSON.parse(localStorage.getItem("gplm"))}catch(e){}
S={club:null,md:0,res:[],f:"4-4-2",st:"Balanced",tab:"table",last:null,cash:0,fans:55,board:60,mor:60,news:[],mk:null,mkmd:-9,press:false,cup:null,stad:0,tp:40,ac:0,yth:[],...(S||{})};if(S.sq)SQ=S.sq;
const save=()=>{S.sq=SQ;try{localStorage.setItem("gplm",JSON.stringify(S))}catch(e){}};
function sim(h,a){const sh=str(h,h==S.club?S.f:"4-4-2",h==S.club?S.st:"Balanced"),sa=str(a,a==S.club?S.f:"4-4-2",a==S.club?S.st:"Balanced");
return[Math.min(7,poi(1.35*Math.exp((sh[0]+3-sa[1])/22))),Math.min(7,poi(1.1*Math.exp((sa[0]-sh[1]-3)/22)))]}
function scorers(i,g){const x=xi(i,S.f),pool=[...x.FW,...x.FW,...x.MF,...x.DF.slice(0,2)];return Array.from({length:g},()=>({m:1+Math.random()*89|0,n:pool[Math.random()*pool.length|0].n})).sort((a,b)=>a.m-b.m)}
const cl=v=>Math.max(0,Math.min(100,v)),val=p=>Math.max(.1,Math.pow(Math.max(p.r-45,0),2)/120*(p.a>30?.6:p.a<23?1.3:1)),m2=v=>"GH₵"+v.toFixed(2)+"m",MN={GK:2,DF:5,MF:5,FW:3};
function initCup(){S.cup={r:0,al:[...T.keys()].sort(()=>Math.random()-.5),rs:[]}}
const CN=n=>n==2?"Final":n==4?"Semi-finals":n==8?"Quarter-finals":n==16?"Round of 16":"Preliminary round",CD=[6,12,18,24,30],capc=()=>4000+T[S.club][1]*80+S.stad*2500,att0=()=>Math.round(Math.min(capc(),capc()*(.3+.7*S.fans/100)*(1.3-S.tp/100))),gate=()=>att0()*S.tp/1e6;
function cupRound(){if(!S.cup)initCup();const c=S.cup;if(c.al.length<2)return;const L2=c.al.length,P=2**Math.floor(Math.log2(L2)),k=P==L2?L2:2*(L2-P),w=c.al.slice(k),o=[],nm=P==L2?CN(L2):"Preliminary round";for(let i=0;i<k;i+=2){const h=c.al[i],a=c.al[i+1];let[x,y]=sim(h,a),p=x==y;const win=x>y?h:x<y?a:(Math.random()<.5?h:a);w.push(win);o.push([h,a,x,y,win,p]);if(h==S.club||a==S.club){S.news.unshift(`FA Cup, ${nm}: ${T[h][0]} ${x}–${y} ${T[a][0]}${p?" (penalties)":""}.`);if(win==S.club){S.cash+=.1+.2*c.r;S.fans=cl(S.fans+2)}else S.fans=cl(S.fans-2)}}
c.rs.push(o);(c.nm=c.nm||[]).push(nm);c.al=w;c.r++;if(w.length==1&&w[0]==S.club){S.cash+=1;S.fans=cl(S.fans+10);S.news.unshift("You won the Ghana FA Cup!")}}
function stad(){const c=S.stad+1;if(S.stad>=4||S.cash<c){alert(S.stad>=4?"The stadium is at maximum size.":"Not enough cash.");return}S.cash-=c;S.stad++;S.news.unshift(`Stadium expanded to ${capc().toLocaleString()} seats.`);save();render()}
function acad(){const c=.5*(S.ac+1);if(S.ac>=5||S.cash<c){alert(S.ac>=5?"The academy is at maximum level.":"Not enough cash.");return}S.cash-=c;S.ac++;save();render()}
function promo(k){const p=S.yth.splice(k,1)[0];SQ[S.club].push(p);S.news.unshift(`${p.n} (age ${p.a}) was promoted to the first team.`);save();render()}
function rn(k){const p=SQ[S.club][k],v=prompt("Player name",p.n);if(v&&v.trim()){p.n=v.trim();save();render()}}
function imp(){const n=[];document.getElementById("imp").value.trim().split("\n").forEach(l=>{const[a,b,c,d,e]=l.split(",").map(x=>x.trim()),P=(b||"").toUpperCase();if(a&&MN[P])n.push({n:a,p:P,r:Math.max(40,Math.min(92,+c||60)),a:+d||24,f:e||"🇬🇭",inj:0})});if(n.length<15||Object.keys(MN).some(k=>n.filter(x=>x.p==k).length<MN[k])){alert("Need 15+ players with at least 2 GK, 5 DF, 5 MF and 3 FW. Format: Name, POS, Rating, Age");return}SQ[S.club]=n;save();render()}
function pick(i){S.club=i;S.cash=+((T[i][1]-50)/4).toFixed(2);S.fans=55;S.mor=60;S.board=60;S.news=[];S.mk=null;S.md=0;S.res=[];S.last=null;S.press=false;S.stad=0;S.tp=40;S.ac=0;S.yth=[];initCup();SQ=mkSQ();save();render()}
function newSeason(){S.md=0;S.res=[];S.last=null;S.mk=null;S.news=[];S.cash+=.5;initCup();S.yth.forEach(p=>{p.a++;p.r+=2});for(let i=0;i<1+S.ac;i++)S.yth.push({n:FN[Math.random()*18|0]+" "+SN[Math.random()*18|0],p:POS[Math.random()*18|0],r:T[S.club][1]-24+S.ac*4+(Math.random()*8|0),a:17,inj:0});SQ.forEach(s=>s.forEach(p=>{p.a++;p.inj=0;p.r=Math.max(40,Math.min(92,p.r+(p.a<24?1+(Math.random()*2|0):p.a>31?-(Math.random()*3|0):(Math.random()*3|0)-1)))}));save();render()}
function gen(){S.mk=Array.from({length:8},()=>({n:FN[Math.random()*18|0]+" "+SN[Math.random()*18|0],p:POS[Math.random()*18|0],r:T[S.club][1]+(Math.random()*16-6|0),a:19+(Math.random()*15|0),f:Math.random()<.35?FL[Math.random()*8|0]:"🇬🇭",inj:0}));S.mkmd=S.md}
function buy(k){const p=S.mk[k],c=val(p);if(S.cash<c){alert("Not enough cash.");return}S.cash-=c;SQ[S.club].push(p);S.mk.splice(k,1);S.news.unshift(`Transfer: ${p.n} (${p.p}, ${p.r}) joins ${T[S.club][0]} for ${m2(c)}.`);save();render()}
function sell(k){const s=SQ[S.club],p=s[k];if(s.length<=15||s.filter(x=>x.p==p.p).length<=MN[p.p]){alert("Keep at least 15 players: 2 GK, 5 DF, 5 MF and 3 FW.");return}S.cash+=.8*val(p);S.news.unshift(`Transfer: ${p.n} leaves ${T[S.club][0]} for ${m2(.8*val(p))}.`);s.splice(k,1);save();render()}
function train(){if(S.cash<.4){alert("Not enough cash.");return}S.cash-=.4;S.mor=cl(S.mor+3);const s=SQ[S.club];for(let i=0;i<3;i++){const p=s[Math.random()*s.length|0];p.r=Math.min(92,p.r+1)}S.news.unshift("Training camp: three players improved.");save();render()}
function pr(k){const e=[[1,4,0,"praised the players"],[0,1,3,"kept things calm"],[3,2,-3,"blamed the referee"]][k];S.fans=cl(S.fans+e[0]);S.mor=cl(S.mor+e[1]);S.board=cl(S.board+e[2]);S.news.unshift(`Press room: the coach ${e[3]} after matchday ${S.last.md}.`);S.press=false;save();render()}
function after(){const L=S.last,me=L.home?L.hg-L.ag:L.ag-L.hg,n=[],cn=T[S.club][0];
SQ.forEach((s,i)=>s.forEach(p=>{if(p.inj>0)p.inj--;else if(Math.random()<.025){p.inj=1+(Math.random()*6|0);if(i==S.club)n.push(`${p.n} (${p.p}) is injured and will miss ${p.inj} matches.`)}}));
S.fans=cl(S.fans+(me>0?4:me<0?-5:0));S.mor=cl(S.mor+(me>0?5:me<0?-6:-1));S.board=cl(S.board+(me>0?3:me<0?-4:0));
const w=SQ[S.club].reduce((s,p)=>s+p.r-40,0)/4000,inc=.1+(L.home?gate():0)+(me>0?.03:0);S.cash+=inc-w;S.fin={inc,w};
const sc=`${T[L.h][0]} ${L.hg}–${L.ag} ${T[L.a][0]}`,d=Math.abs(me);
n.unshift(me>0?(d>2?`Rampant ${cn}! ${sc} sends a message to the league.`:`Three points for ${cn}: ${sc}.`):me<0?(d>2?`Crisis at ${cn}? Fans furious after ${sc}.`:`${cn} fall short: ${sc}.`):`Honours even: ${sc}.`);
const f=S.res.map(m=>m.find(o=>o[0]==S.club||o[1]==S.club)).slice(-3).map(o=>o[0]==S.club?o[2]-o[3]:o[3]-o[2]);
if(f.length==3&&f.every(x=>x>0))n.push("Three wins in a row. Fans are dreaming of the title.");if(f.length==3&&f.every(x=>x<0))n.push("Three defeats in a row. Pressure is building on the coach.");
if(S.cash<0){S.board=cl(S.board-3);n.push("The board is worried about the club’s debts.")}
S.news=n.map(x=>`Matchday ${L.md}: ${x}`).concat(S.news).slice(0,25);S.press=true;if(CD.includes(S.md))cupRound()}
const CL=[["#c8102e","#1d3f8f"],["#d7141a","#ffffff"],["#f2c200","#111111"],["#f6c91d","#0b6b3a"],["#1f8a3b","#f6d02f"],["#1a4fb4","#ffffff"],["#2b6cd4","#ffffff"],["#e8731c","#111111"],["#0e7a4a","#ffffff"],["#6b2fa0","#f2c200"],["#e8b923","#1a4fb4"],["#2e8b57","#ffffff"],["#0aa5c9","#ffffff"],["#c99a1c","#111111"],["#8a1c2b","#ffffff"],["#222222","#e8b923"],["#111111","#ffffff"],["#b0123a","#ffffff"]];
const ini=i=>T[i][0].split(" ").filter(w=>!["FC","SC","of"].includes(w)).map(w=>w[0]).slice(0,2).join("").toUpperCase(),crest=(i,s=24)=>`<svg width="${s}" height="${s*1.15|0}" viewBox="0 0 24 28" style="vertical-align:middle"><path d="M2 2h20v13c0 6-5 10-10 12C7 25 2 21 2 15z" fill="${CL[i][0]}" stroke="${CL[i][1]}" stroke-width="2"/><text x="12" y="16.5" text-anchor="middle" font-size="9" font-weight="800" fill="#fff" stroke="#000" stroke-width=".5" paint-order="stroke" font-family="sans-serif">${ini(i)}</text></svg>`;
let AC=null,mute=false;
function beep(f,d,t=0,v=.15,ty="sine"){if(!AC||mute)return;const o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime+t;o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(AC.destination);o.start(n);o.stop(n+d)}
function roar(){if(!AC||mute)return;const n=AC.sampleRate*1.5|0,b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();f.type="bandpass";f.frequency.value=900;g.gain.value=.3;s.buffer=b;s.connect(f);f.connect(g);g.connect(AC.destination);s.start()}
let tm=null;function skip(){clearInterval(tm);render()}
function watch(){clearInterval(tm);try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume()}catch(e){}beep(1800,.4,0,.08,"triangle");const L=S.last,my=t=>t==S.club,sh=str(L.h,my(L.h)?S.f:"4-4-2",my(L.h)?S.st:"Balanced"),sa=str(L.a,my(L.a)?S.f:"4-4-2",my(L.a)?S.st:"Balanced"),b=Math.max(.3,Math.min(.7,.5+(sh[0]+sh[1]-sa[0]-sa[1])/60)),H=[[6,32],[18,12],[18,26],[18,38],[18,52],[32,16],[32,32],[32,48],[42,22],[42,42]],A=H.map(([x,y])=>[100-x,64-y]),CM=["Corner kick","Shot blocked","Free kick in a dangerous spot","Great save by the keeper","Long ball forward","Strong tackle in midfield","Shot just wide"],ln="stroke:#fff;stroke-opacity:.6;fill:none;stroke-width:.4",hc=CL[L.h][0],ac0=CL[L.a][0],ac=ac0==hc?CL[L.a][1]:ac0;
$(`<div class="card"><div class="mu" style="text-align:center">Matchday ${L.md}</div><div class="sc" style="font-size:19px">${crest(L.h,30)} ${T[L.h][0]} <span id="mt">0–0</span> ${T[L.a][0]} ${crest(L.a,30)}</div><div id="mn" class="mu" style="text-align:center">0’</div><svg viewBox="0 0 100 64" style="width:100%;display:block;margin:8px 0;border-radius:8px;background:#2f8f4e"><rect x="1" y="1" width="98" height="62" style="${ln}"/><line x1="50" y1="1" x2="50" y2="63" style="${ln}"/><circle cx="50" cy="32" r="7" style="${ln}"/><rect x="1" y="18" width="12" height="28" style="${ln}"/><rect x="87" y="18" width="12" height="28" style="${ln}"/>${H.map(([x,y],i)=>`<circle id="h${i}" cx="${x}" cy="${y}" r="1.7" fill="${hc}" stroke="#fff" stroke-width=".3"/>`).join("")}${A.map(([x,y],i)=>`<circle id="a${i}" cx="${x}" cy="${y}" r="1.7" fill="${ac}" stroke="#fff" stroke-width=".3"/>`).join("")}<circle id="bl" cx="50" cy="32" r="1.2" fill="#fff" stroke="#000" stroke-width=".3"/></svg><div id="cm" style="text-align:center;min-height:26px;font-weight:600">Kick-off</div><button class="sm" onclick="skip()">Skip to full time</button> <button class="sm" onclick="mute=!mute;this.textContent=mute?'Sound off':'Sound on'">${mute?"Sound off":"Sound on"}</button></div>`);
let mn=0,hg=0,ag=0,bx=50,by=32,hold=0;const g=id=>document.getElementById(id);
tm=setInterval(()=>{mn++;const gl=L.ev.filter(e=>e.m==mn);let msg=null;
if(gl.length){gl.forEach(e=>e.t==L.h?hg++:ag++);bx=gl[0].t==L.h?97:3;by=32;msg=`GOAL! ${gl[0].n} (${T[gl[0].t][0]})`;hold=7;roar();beep(660,.15);beep(880,.25,.15)}
else{bx=Math.max(6,Math.min(94,bx+(Math.random()<b?1:-1)*Math.random()*16+(50-bx)*.12));by=Math.max(8,Math.min(56,by+(Math.random()-.5)*20));if(mn==45){msg="Half time";beep(1800,.5,0,.08,"triangle")}else if(mn==90){msg="Full time";beep(1800,.8,0,.08,"triangle")}else if(hold<=0&&Math.random()<.1)msg=CM[Math.random()*CM.length|0]}
if(hold>0&&!gl.length)hold--;
if(msg)g("cm").textContent=msg;
g("bl").setAttribute("cx",bx);g("bl").setAttribute("cy",by);const sf=(bx-50)*.25;H.forEach(([x,y],i)=>{g("h"+i).setAttribute("cx",x+sf);g("h"+i).setAttribute("cy",y+(by-32)*.1)});A.forEach(([x,y],i)=>{g("a"+i).setAttribute("cx",x+sf);g("a"+i).setAttribute("cy",y+(by-32)*.1)});
g("mt").textContent=hg+"–"+ag;g("mn").textContent=mn+"’";
if(mn>=90){clearInterval(tm);setTimeout(render,1200)}},110)}
function play(){if(S.md>=34)return;const out=FX[S.md].map(([h,a])=>{const[hg,ag]=sim(h,a);return[h,a,hg,ag]});S.res.push(out);
const m=out.find(o=>o[0]==S.club||o[1]==S.club);const home=m[0]==S.club;
S.last={md:S.md+1,h:m[0],a:m[1],hg:m[2],ag:m[3],ev:[...scorers(m[0],m[2]).map(e=>({...e,t:m[0]})),...scorers(m[1],m[3]).map(e=>({...e,t:m[1]}))].sort((a,b)=>a.m-b.m),home};
S.md++;after();save();watch()}
function table(){const t=T.map((x,i)=>({i,p:0,w:0,d:0,l:0,gf:0,ga:0,pt:0}));S.res.flat().forEach(([h,a,hg,ag])=>{[[h,hg,ag],[a,ag,hg]].forEach(([i,f,c])=>{const r=t[i];r.p++;r.gf+=f;r.ga+=c;if(f>c){r.w++;r.pt+=3}else if(f==c){r.d++;r.pt++}else r.l++})});return t.sort((a,b)=>b.pt-a.pt||(b.gf-b.ga)-(a.gf-a.ga)||b.gf-a.gf)}
const $=s=>document.getElementById("app").innerHTML=s;
function render(){
if(S.club===null){$(`<h1>GPL Manager</h1><p class="mu">Pick your club and manage a full 34-match Ghana Premier League season.</p><div class="pick">${T.map((t,i)=>`<button onclick="pick(${i})">${crest(i,26)} <b>${t[0]}</b><br><span class="mu">Strength ${t[1]}</span></button>`).join("")}</div>`);return}
const tb=table(),pos=tb.findIndex(r=>r.i==S.club)+1,done=S.md>=34;
if(S.board<=15&&S.md>=8){$(`<h1>You’re sacked</h1><p class="mu">The board lost confidence in you after ${S.md} matchdays.</p><button class="go" onclick="S.club=null;save();render()">Take a new job</button>`);return}let body="";
if(S.tab=="table")body=`<div class="wrap"><table><tr><th>#</th><th>Club</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GD</th><th>Pts</th></tr>${tb.map((r,k)=>`<tr class="${r.i==S.club?"me":""}"><td>${k+1}</td><td>${crest(r.i,16)} ${T[r.i][0]}</td><td>${r.p}</td><td>${r.w}</td><td>${r.d}</td><td>${r.l}</td><td>${r.gf-r.ga}</td><td>${r.pt}</td></tr>`).join("")}</table></div>`;
if(S.tab=="squad"){const x=xi(S.club,S.f),st=new Set(Object.values(x).flat());body=`<p class="mu">Starters for ${S.f} are marked ●. Best players in each position start.</p><div class="wrap"><table><tr><th></th><th>Player</th><th>Pos</th><th>Rating</th></tr>${[...SQ[S.club]].sort((a,b)=>POS.indexOf(a.p)-POS.indexOf(b.p)||b.r-a.r).map(p=>`<tr><td>${st.has(p)?"●":""}</td><td>${p.n}</td><td>${p.p}</td><td>${p.r}</td></tr>`).join("")}</table></div>`}
if(S.tab=="tactics")body=`<h2>Formation</h2><div class="ch">${Object.keys(FM).map(f=>`<button class="${S.f==f?"on":""}" onclick="S.f='${f}';save();render()">${f}</button>`).join("")}</div><h2>Style</h2><div class="ch">${["Attack","Balanced","Defend"].map(f=>`<button class="${S.st==f?"on":""}" onclick="S.st='${f}';save();render()">${f}</button>`).join("")}</div><p class="mu">Attack scores more but concedes more. Defend does the opposite. Formations shift weight between defence, midfield and attack.</p>`;
if(S.tab=="results")body=S.res.length?S.res.map((m,k)=>`<div class="card"><b>Matchday ${k+1}</b>${m.map(([h,a,hg,ag])=>`<div class="row ${h==S.club||a==S.club?"w":""}"><span>${T[h][0]}</span><span>${hg}–${ag}</span><span style="text-align:right">${T[a][0]}</span></div>`).join("")}</div>`).reverse().join(""):`<p class="mu">No matches yet. Play your first matchday.</p>`;
const sq=SQ[S.club],st=new Set(Object.values(xi(S.club,S.f)).flat()),tg=[...T.keys()].sort((a,b)=>T[b][1]-T[a][1]).indexOf(S.club)+1;
if(S.tab=="squad")body=`<p class="mu">● starts in your ${S.f}. Injured players are skipped automatically. Selling returns 80% of value.</p><div class="wrap"><table><tr><th></th><th>Player</th><th>Pos</th><th>Age</th><th>Rtg</th><th>Status</th><th></th></tr>${sq.map((p,k)=>({p,k})).sort((a,b)=>POS.indexOf(a.p.p)-POS.indexOf(b.p.p)||b.p.r-a.p.r).map(({p,k})=>`<tr><td>${st.has(p)?"●":""}</td><td onclick="rn(${k})" style="text-decoration:underline dotted">${p.f||"🇬🇭"} ${p.n}</td><td>${p.p}</td><td>${p.a}</td><td>${p.r}</td><td class="${p.inj?"l":""}">${p.inj?"Out "+p.inj:"Fit"}</td><td><button class="sm" onclick="sell(${k})">Sell ${(.8*val(p)).toFixed(1)}m</button></td></tr>`).join("")}</table></div><details style="margin-top:10px"><summary>Use real player names</summary><p class="mu">Tap any name above to rename it. Or paste a full squad, one player per line: Name, POS, Rating, Age. POS is GK, DF, MF or FW. You need 15+ players with at least 2 GK, 5 DF, 5 MF and 3 FW.</p><textarea id="imp" rows="8" style="width:100%;background:var(--sf);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:8px;font:inherit" placeholder="Kwame Mensah, DF, 70, 25"></textarea><button class="sm" onclick="imp()">Replace squad</button></details>`;
if(S.tab=="market"){if(!S.mk||S.md-S.mkmd>=5)gen();body=`<div class="card row"><span>Cash</span><b>${m2(S.cash)}</b></div><p class="mu">Free agents and players from other clubs. The list refreshes every 5 matchdays.</p>${S.mk.map((p,k)=>`<div class="card row"><span><b>${p.f||"🇬🇭"} ${p.n}</b><br><span class="mu">${p.p}, age ${p.a}, rating ${p.r}</span></span><button class="sm" onclick="buy(${k})">Buy ${val(p).toFixed(2)}m</button></div>`).join("")}`}
if(S.tab=="club"){const cap=capc(),att=att0(),bar=(l,v)=>`<div class="row"><span>${l}</span><span>${v}/100</span></div><div style="height:6px;background:var(--bd);border-radius:3px;margin-bottom:8px"><div style="height:6px;width:${v}%;background:var(--ac);border-radius:3px"></div></div>`;body=`<div class="card">${bar("Fan support",S.fans)}${bar("Squad morale",S.mor)}${bar("Board confidence",S.board)}<p class="mu" style="margin:0">The board expects a finish of ${tg} or higher. Fans and morale lift your team’s performance.</p></div><div class="card"><div class="row"><span>Cash</span><b>${m2(S.cash)}</b></div><div class="row"><span>Stadium attendance</span><b>${att.toLocaleString()}</b></div>${S.fin?`<div class="row"><span>Last matchday income</span><b>${m2(S.fin.inc)}</b></div><div class="row"><span>Wage bill per matchday</span><b>${m2(S.fin.w)}</b></div>`:""}</div><button onclick="train()">Fund a training camp (GH₵0.40m)</button><div class="card"><b>Ticket price</b> <span class="mu">(higher price, fewer fans)</span><div class="ch" style="margin-top:6px">${[[20,"Low"],[40,"Normal"],[70,"High"]].map(([v,l])=>`<button class="sm ${S.tp==v?"on":""}" onclick="S.tp=${v};save();render()">${l} GH₵${v}</button>`).join("")}</div></div><div class="card row"><span>Stadium: ${cap.toLocaleString()} seats</span><button class="sm" onclick="stad()">${S.stad>=4?"Max size":"Expand, GH₵"+(S.stad+1)+".00m"}</button></div><div class="card"><div class="row"><span>Youth academy level ${S.ac}/5</span><button class="sm" onclick="acad()">${S.ac>=5?"Max level":"Upgrade, GH₵"+(.5*(S.ac+1)).toFixed(2)+"m"}</button></div><p class="mu" style="margin:6px 0">${1+S.ac} new prospect(s) arrive each season.</p>${S.yth.map((p,k)=>`<div class="row" style="margin:4px 0"><span>${p.n}, ${p.p}, age ${p.a}, rating ${p.r}</span><button class="sm" onclick="promo(${k})">Promote</button></div>`).join("")}</div>`}
if(S.tab=="news")body=S.news.length?S.news.map(n=>`<div class="news">${n}</div>`).join(""):`<p class="mu">No headlines yet. Play a matchday.</p>`;
if(S.tab=="cup"){if(!S.cup)initCup();const c=S.cup,al=c.al.includes(S.club),nx=(c.al.length&(c.al.length-1)?"Preliminary round":CN(c.al.length))+" after matchday "+CD[c.r];body=`<div class="card"><b>Ghana FA Cup</b><p class="mu" style="margin:4px 0 0">${c.al.length==1?(c.al[0]==S.club?"You are the champions.":T[c.al[0]][0]+" won the cup."):al?"You are still in. Next: "+nx+".":"You are out. Next round: "+nx+"."}</p></div>`+c.rs.map((o,k)=>`<div class="card"><b>${(c.nm&&c.nm[k])||"Round "+(k+1)}</b>${o.map(([h,a,x,y,w,p])=>`<div class="row ${w==S.club?"w":h==S.club||a==S.club?"l":""}"><span>${T[h][0]}</span><span>${x}–${y}${p?"*":""}</span><span style="text-align:right">${T[a][0]}</span></div>`).join("")}</div>`).reverse().join("")+`<p class="mu">* decided on penalties. Cup rounds are played after matchdays 6, 12, 18, 24 and 30.</p>`}
const strip=`<div class="row mu" style="margin:8px 0;font-size:13px"><span>${m2(S.cash)}</span><span>Fans ${S.fans}</span><span>Morale ${S.mor}</span><span>Board ${S.board}</span><span>Injured ${sq.filter(p=>p.inj).length}</span></div>`;
const press=S.press&&S.last?`<div class="card"><b>Press conference</b><p class="mu" style="margin:4px 0 8px">Reporters ask about matchday ${S.last.md}. How do you answer?</p><div class="ch"><button class="sm" onclick="pr(0)">Praise the team</button><button class="sm" onclick="pr(1)">Stay humble</button><button class="sm" onclick="pr(2)">Blame the referee</button></div></div>`:"";
let last="";if(S.last){const L=S.last,me=L.home?L.hg-L.ag:L.ag-L.hg;last=`<div class="card"><div class="mu">Matchday ${L.md}</div><div class="sc">${T[L.h][0]} ${L.hg}–${L.ag} ${T[L.a][0]}</div><p class="${me>0?"w":me<0?"l":""}" style="text-align:center;margin:4px 0">${me>0?"Win":me<0?"Defeat":"Draw"}</p>${L.ev.map(e=>`<div>${e.m}’ ${e.n} <span class="mu">(${T[e.t][0]})</span></div>`).join("")||`<div class="mu">No goals.</div>`}</div>`}
const end=done?`<div class="card"><b>Season over.</b> You finished ${pos}${pos==1?" — champions of Ghana!":pos<=3?", a podium finish.":pos>=16?", in the relegation places.":"."}<br><button style="margin-top:8px" onclick="newSeason()">Start new season</button></div>`:"";
$(`<div class="row"><div><h1>${crest(S.club,34)} ${T[S.club][0]}</h1><span class="mu">Matchday ${Math.min(S.md+1,34)} of 34 · Position ${pos}</span></div><button onclick="if(confirm('Change club and lose this season?')){S.club=null;S.md=0;S.res=[];S.last=null;save();render()}">Change club</button></div>
${done?end:`<button class="go" onclick="play()">Play matchday ${S.md+1}</button>`}${strip}${press}${last}
<div class="tabs">${[["table","Table"],["squad","Squad"],["tactics","Tactics"],["market","Market"],["club","Club"],["cup","Cup"],["news","News"],["results","Results"]].map(([k,v])=>`<button class="${S.tab==k?"on":""}" onclick="S.tab='${k}';save();render()">${v}</button>`).join("")}</div>${body}`)}
render();
</script></body></html>
